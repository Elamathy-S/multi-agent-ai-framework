name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_evals:
        description: "Run behavioural evals against the real model (needs ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Seed database and start MCP server
        env:
          PYTHONPATH: .
        run: |
          python data/seed_data.py
          nohup python -m server.mcp_server --http --port 8001 > mcp.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null -m 2 http://localhost:8001/sse && break || sleep 1; done

      # Unit + integration + grader tests. A scripted model is used: no API key, no network.
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -v --tb=short

      - if: failure()
        run: cat mcp.log

  live-evals:
    if: github.event_name == 'workflow_dispatch' && inputs.live_evals
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run behavioural evals (real model, 3 trials per case)
        env:
          PYTHONPATH: .
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python data/seed_data.py
          nohup python -m server.mcp_server --http --port 8001 > mcp.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null -m 2 http://localhost:8001/sse && break || sleep 1; done
          python evals/run_evals.py --trials 3 --min-pass 0.8
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: evals/report.json }
