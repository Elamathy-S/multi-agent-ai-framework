name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/test_tool_router.py tests/test_permissions.py tests/test_orchestrator.py -v --tb=short

      - name: Run evals (offline)
        run: |
          PYTHONPATH=. pytest evals/ -v --tb=short -k "not integration"