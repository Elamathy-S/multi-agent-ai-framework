# docker compose up                      -> uses the Anthropic API (set ANTHROPIC_API_KEY)
# docker compose --profile local-llm up  -> adds Ollama (set LLM_PROVIDER=ollama, LLM_MODEL=qwen2.5:7b)
services:
  mcp-server:
    build: .
    command: sh -c "python data/seed_data.py && python -m server.mcp_server --http --port 8001"
    ports: ["8001:8001"]
    volumes: ["appdata:/data"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/sse', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports: ["8080:8080"]
    volumes: ["appdata:/data"]
    env_file: [.env]
    environment:
      MCP_SERVER_URL: http://mcp-server:8001/sse
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      mcp-server: { condition: service_healthy }

  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]

volumes:
  appdata:
  ollama_data:
